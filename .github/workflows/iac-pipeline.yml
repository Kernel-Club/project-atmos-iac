# pull request -> checks + plan (plan is posted as a comment)
# push to main -> checks + plan + apply (apply waits for a manual approval)
#
# Settings come from GitHub, nothing is hardcoded here:
#   variables: AWS_REGION, PROJECT_NAME (organization); AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN (repository)
#   secrets:   OPENWEATHER_API_KEY (organization); PLAN_ENCRYPTION_KEY (repository)
name: IaC pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pushes wait in one queue (a run waiting for approval does not block pull requests).
# Never cancel: a cancelled apply can leave the state locked.
concurrency:
  group: terraform-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.x
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_github_org: ${{ github.repository_owner }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # -backend=false: no S3 and no AWS login needed here
      - name: validate (root)
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate (bootstrap)
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: trivy config scan
        # Pinned to a commit (v0.36.0) so the tag cannot be changed under us.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    needs: checks
    # Pull requests from forks get no AWS access and no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      TF_VAR_openweather_api_key: ${{ secrets.OPENWEATHER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      # exit code: 0 = no changes, 2 = changes, 1 = error
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: show plan
        run: terraform show -no-color tfplan > plan.txt

      - name: plan in job summary
        run: |
          {
            echo "## Terraform plan"
            echo '```'
            head -c 900000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: plan in pull request comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n... (cut, see the Summary of the run)';
            }
            const body = `${marker}\n## Terraform plan\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The repository is public and the plan holds secret values: encrypt it.
      - name: encrypt plan
        if: github.event_name == 'push' && steps.plan.outputs.changes == 'true'
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PLAN_ENCRYPTION_KEY -in tfplan -out tfplan.enc

      - name: save plan for apply
        if: github.event_name == 'push' && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan.enc
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Waits for a reviewer. AWS also lets only this environment assume the apply role.
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: decrypt plan
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PLAN_ENCRYPTION_KEY -in tfplan.enc -out tfplan

      - name: terraform init
        run: terraform init -input=false

      # Refuses a stale plan: if the state changed after the plan, nothing is applied.
      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
